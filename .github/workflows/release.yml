name: release

# Run by hand from main, semantic-release picks the version from the commits.
# A pushed version tag releases exactly that version, which is how the first
# release, v0.0.1, comes about: semantic-release starts a fresh history at
# 1.0.0. Tags semantic-release pushes carry the workflow's own token, which
# starts no workflow, so no version releases twice.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - run: npm ci
        working-directory: source/frontend

      - run: npm test
        working-directory: source/frontend

      # The Go module embeds the built front end, so it compiles only once
      # `frontend/dist` exists.
      - run: npm run build
        working-directory: source/frontend

      - run: go test -race ./...
        working-directory: source

  release:
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      # The window's controls take their size from the SDK the app links
      # against, and the layout reserves room for the macOS 26 pair.
      - name: Require the macOS 26 SDK
        run: |
          sdk=$(xcrun --show-sdk-version)
          echo "macOS SDK $sdk"
          [ "${sdk%%.*}" -ge 26 ]

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          install-only: true

      # The notes generator semantic-release bundles renders with
      # conventional-changelog-writer 8; the conventionalcommits preset needs
      # writer 9 from its major 10 on, so it stays on major 9.
      - name: Release the next version
        if: github.event_name == 'workflow_dispatch'
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Release the pushed version
        if: github.event_name == 'push'
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
