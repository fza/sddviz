# Derived from the FormatD-English rule of the same name, MIT licensed, with an
# exception list. It reads any run of three to five capitals as an acronym, so
# the domain names this repository writes daily, the system tokens that cannot
# be expanded, and its own severity markers all need naming here.
extends: conditional
message: "'%s' has no definition."
link: https://learn.microsoft.com/en-us/style-guide/acronyms
level: suggestion
ignorecase: false
# Ensures that the existence of 'first' implies the existence of 'second'.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
# Every exception is three to five letters, because `first` above matches
# nothing else. A shorter token and a longer one -- `CI`, `ENOENT`, `EOPNOTSUPP`
# -- never reach this rule at all, so listing one buys nothing.
#
# ... with the exception of these. Three groups sit below the set this rule
# arrived with. The domain acronyms this project writes daily, which a reader
# of an infrastructure document already knows and which no document expands.
# This repository's own severity markers, which are defined terms rather than
# emphasis. And the shell and system tokens, which name a variable, a stream
# position or an error and cannot be expanded at all.
exceptions:
  - API
  - ASP
  - CLI
  - CPU
  - CSS
  - CSV
  - DEBUG
  - DOM
  - DPI
  - FAQ
  - GCC
  - GNU
  - GDB
  - GET
