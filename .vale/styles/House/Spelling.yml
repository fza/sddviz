# Technical prose carries identifiers, and an identifier is not a misspelling. The filters
# skip the three shapes a dictionary can never hold: a camelCase or PascalCase token, an
# all-capitals one, and a snake_case one. What is left is ordinary English, which is what a
# dictionary can judge.
#
# A project's own vocabulary — the words that name its parts — belongs in that project's
# accept.txt, never here.
extends: spelling
message: "Did you really mean '%s'?"
level: error
filters:
  - '[a-z]+[A-Z]'
  - '^[A-Z]{2,}'
  - '[a-z]+_[a-z]'
