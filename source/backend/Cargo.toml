[package]
name = "sddviz"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A read-only viewer for SDD decision graphs"
license = "MIT"
publish = false

[lib]
name = "sddviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
