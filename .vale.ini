StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

# Run every rule on every file, and disable none. Repair a finding in the prose:
# backticks where a comment names code, sentence case where capitals were
# emphasis, the plain word where a decorative one crept in.
#
# Add an extension here only where Vale parses that language. It reads comments
# from a language it knows and the whole file from one it does not, so a string
# literal in an unparsed language reports as English. Aliasing an extension
# through `[formats]` makes it check nothing at all.
#
# Take a House rule as the single copy of the rule it derives from. Each names
# what it changed against the rule it replaces, so delete the original rather
# than switching it off per section: a rule and its replacement can never both
# fire, and no disable has to stay in step across three places. LICENSE covers
# the whole set.
[*.{md,css,html,js,jsx,json5,py,rs,sh,bash,zsh,ts,tsx,yml,yaml}]
BasedOnStyles = Vale, House

# Leave these trees unlinted: none of them is this repository's own prose.
# `.sdd/` and `.claude/` belong to their tools, and the rest is generated or
# vendored.
[.sdd/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

# The rule definitions are Vale's own prose, carrying the banned words and the
# passive constructions they exist to catch. Linting them reports the rules
# against themselves.
[.vale/**]
BasedOnStyles =

# Scratch. Nothing here is a deliverable and nothing here is committed.
[.tmp/**]
BasedOnStyles =

[**/node_modules/**]
BasedOnStyles =

[**/target/**]
BasedOnStyles =

[**/dist/**]
BasedOnStyles =
