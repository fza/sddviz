StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

# Run every rule on every file, and disable none. Repair a finding in the prose:
# backticks where a comment names code, sentence case where capitals were
# emphasis, the plain word where a decorative one crept in.
#
# Add an extension here only where Vale parses that language. It reads comments
# from a language it knows and the whole file from one it does not, so a string
# literal in an unparsed language reports as English. Aliasing an extension
# through `[formats]` makes it check nothing at all.
#
# Take a House rule as the single copy of the rule it derives from. Each names
# what it changed against the rule it replaces, so delete the original rather
# than switching it off per section: a rule and its replacement can never both
# fire, and no disable has to stay in step across three places. LICENSE covers
# the whole set.
[*.{md,css,go,html,js,jsx,json5,py,sh,bash,zsh,ts,tsx,yml,yaml}]
BasedOnStyles = Vale, Taxonomy, House

# Leave these trees unlinted: none of them is this repository's own prose.
# `.sdd/` and `.claude/` belong to their tools, and the rest is generated or
# vendored.
[.sdd/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

# The rule definitions are Vale's own prose, carrying the banned words and the
# passive constructions they exist to catch. Linting them reports the rules
# against themselves.
[.vale/**]
BasedOnStyles =

# Linter configuration. Every value in it is a rule name rather than a word.
[.golangci.yml]
BasedOnStyles =

# Release configuration and the workflow running it. Vale reads YAML as text
# rather than as comments, and every key in these is a tool's own name.
[{.goreleaser.yaml,.releaserc.yml,.github/**}]
BasedOnStyles =

# Test fixtures: real graph documents captured from a repository, plus one
# deliberately malformed document the reader has to refuse. Neither is this
# repository's prose, and the malformed one no parser can read by design.
[source/internal/**/testdata/**]
BasedOnStyles =

# The build system, vendored from the framework's template. Task definitions and
# platform configuration rather than this repository's prose.
[source/Taskfile.yml]
BasedOnStyles =

[source/build/**]
BasedOnStyles =

[**/node_modules/**]
BasedOnStyles =

# Generated by `wails3 generate bindings`; the comments are the tool's, and its
# header is written in Welsh.
[source/frontend/bindings/**]
BasedOnStyles =

[**/dist/**]
BasedOnStyles =
